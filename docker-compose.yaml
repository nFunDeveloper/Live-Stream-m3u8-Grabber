services:
  nginx:
    build:
      context: .
      dockerfile: stream-service/Dockerfile.nginx
    ports:
      - "10000:80"
    depends_on: [backend]
    restart: always

  backend:
    build:
      context: ./stream-service
      dockerfile: Dockerfile.backend
    environment:
      # 인증번호 잠금. 끄려면 APP_AUTH=off (개발·테스트용)
      - APP_AUTH=${APP_AUTH:-on}
      # 인증번호 갱신 기준 시각. 자정(00시)이 이 시간대로 바뀐다.
      - APP_TZ=${APP_TZ:-Asia/Seoul}
      # 매일 갱신된 인증번호를 보내줄 관리용 텔레그램 봇.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # 세션 쿠키 서명 키. 이 값이 바뀌면 모두 다시 비밀번호를 쳐야 한다.
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-before-deploying}
      # 실패 횟수·nonce·날짜별 인증번호가 담기는 파일. 컨테이너가 새로 만들어져도
      # 잠금이 풀리지 않게 볼륨에 둔다. (컨테이너 안 /tmp 에 두면 재시작 때 사라진다)
      - APP_STATE_FILE=${APP_STATE_FILE:-/state/auth.json}
    volumes:
      - auth-state:/state
    expose: ["10000"]
    restart: always

volumes:
  auth-state:
