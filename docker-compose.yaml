services:
  nginx:
    build:
      context: .
      dockerfile: stream-service/Dockerfile.nginx
    ports:
      - "10000:80"
    depends_on: [backend]
    restart: always

  backend:
    build:
      context: ./stream-service
      dockerfile: Dockerfile.backend
    environment:
      # 앱을 열 때 물어볼 비밀번호. 환경변수를 덮어쓰면 배포마다 바꿀 수 있다.
      - APP_PASSWORD=${APP_PASSWORD:-1322}
      # 세션 쿠키 서명 키. 이 값이 바뀌면 모두 다시 비밀번호를 쳐야 한다.
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-before-deploying}
      # 실패 횟수와 nonce 가 담기는 파일. 컨테이너가 새로 만들어져도 잠금이
      # 풀리지 않게 볼륨에 둔다. (컨테이너 안 /tmp 에 두면 재시작 때 사라진다)
      - APP_STATE_FILE=${APP_STATE_FILE:-/state/auth.json}
    volumes:
      - auth-state:/state
    expose: ["10000"]
    restart: always

volumes:
  auth-state:
