services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
    ports:
      - "10000:80"
    depends_on: [vite-dev, backend]

  vite-dev:
    image: node:22-slim
    working_dir: /app
    environment:
      - VITE_BASE=/develop/
    volumes:
      - ./stream-service/src/ui:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    expose: ["5173"]

  backend:
    build:
      context: ./stream-service
      dockerfile: Dockerfile.backend
    environment:
      # 앱을 열 때 물어볼 비밀번호. 환경변수를 덮어쓰면 배포마다 바꿀 수 있다.
      - APP_PASSWORD=${APP_PASSWORD:-calico}
      # 세션 쿠키 서명 키. 이 값이 바뀌면 모두 다시 비밀번호를 쳐야 한다.
      - APP_SECRET_KEY=${APP_SECRET_KEY:-local-dev-secret}
    expose: ["10000"]
