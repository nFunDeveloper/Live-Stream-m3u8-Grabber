services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
    ports:
      - "10000:80"
    depends_on: [vite-dev, backend]

  vite-dev:
    image: node:22-slim
    working_dir: /app
    environment:
      - VITE_BASE=/develop/
    volumes:
      - ./stream-service/src/ui:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    expose: ["5173"]

  backend:
    build:
      context: ./stream-service
      dockerfile: Dockerfile.backend
    environment:
      # 인증번호 잠금. 로컬 개발은 기본으로 꺼져 있다(비밀번호 없이 바로 입장).
      # 개발에서 잠금을 시험하려면 APP_AUTH=on 으로 켠다.
      - APP_AUTH=${APP_AUTH:-off}
      # 인증번호 갱신 기준 시각. 자정(00시)이 이 시간대로 바뀐다.
      - APP_TZ=${APP_TZ:-Asia/Seoul}
      # 관리용 텔레그램 봇. 로컬 .env 에서 지우면 발송하지 않는다(로그로만 확인).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # 세션 쿠키 서명 키. 이 값이 바뀌면 모두 다시 비밀번호를 쳐야 한다.
      - APP_SECRET_KEY=${APP_SECRET_KEY:-local-dev-secret}
    expose: ["10000"]
